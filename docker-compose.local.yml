# Local operator deployment; use together with docker-compose.yml.
services:
  7review:
    ports: !override
      - "127.0.0.1:${ALPHA_HTTP_PORT:-18087}:8080"
    environment:
      WEBHOOK_REVIEW_MODE: manual_first
      PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      REVIEW_MODEL: "${ALPHA_REVIEW_MODEL:-deepseek-coder-v2:16b}"
      SMALL_MODEL: "${ALPHA_SMALL_MODEL:-qwen2.5-coder-7b-16k:latest}"
    volumes:
      - ./profiles:/app/profiles:ro
      - ./orchestrator.yaml:/app/orchestrator.yaml:ro
  mempalace:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
