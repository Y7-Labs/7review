services:
  7review:
    build:
      context: .
      dockerfile: Dockerfile
    image: 7review-agent:local
    environment:
      LISTEN_ADDR: ":8080"
      HTTP_READ_HEADER_TIMEOUT_MS: "${HTTP_READ_HEADER_TIMEOUT_MS:-5000}"
      HTTP_READ_TIMEOUT_MS: "${HTTP_READ_TIMEOUT_MS:-30000}"
      HTTP_WRITE_TIMEOUT_MS: "${HTTP_WRITE_TIMEOUT_MS:-120000}"
      HTTP_IDLE_TIMEOUT_MS: "${HTTP_IDLE_TIMEOUT_MS:-120000}"
      ORCHESTRATOR_CONFIG: /app/orchestrator.yaml
      INPUT_PROFILE: /app/profiles/default.input-profile.json
      SKILLS_DIR: /app/agent/skills
      INSTRUCTIONS_PATH: /app/agent/instructions.md
      CORPUS_ROOT: /workspace
      MEMORY_DIR: /data/7review
      MAX_DIFF_TOKENS: "${MAX_DIFF_TOKENS:-6000}"
      MAX_SUPPORTING_CORPUS_SECTIONS: "${MAX_SUPPORTING_CORPUS_SECTIONS:-3}"
      HIL_CHANNEL: "${HIL_CHANNEL:-scm_comment}"
      HEADROOM_URL: http://headroom:8787
      HEADROOM_TIMEOUT_MS: "${HEADROOM_TIMEOUT_MS:-30000}"
      MEMPALACE_URL: http://mempalace:8788
      MEMPALACE_TIMEOUT_MS: "${MEMPALACE_TIMEOUT_MS:-240000}"
      REVIEW_API_TOKEN: "${REVIEW_API_TOKEN:-}"
      WEBHOOK_WORKERS: "${WEBHOOK_WORKERS:-4}"
      WEBHOOK_QUEUE_SIZE: "${WEBHOOK_QUEUE_SIZE:-32}"
      WEBHOOK_JOB_TIMEOUT_MS: "${WEBHOOK_JOB_TIMEOUT_MS:-900000}"
      WEBHOOK_REVIEW_MODE: "${WEBHOOK_REVIEW_MODE:-manual_first}"
      REVIEW_LABEL_INCLUDE: "${REVIEW_LABEL_INCLUDE:-7review,ready-for-review}"
      REVIEW_LABEL_EXCLUDE: "${REVIEW_LABEL_EXCLUDE:-no-review,wip,draft}"
      REVIEW_ALLOWED_PROJECTS: "${REVIEW_ALLOWED_PROJECTS:-}"
      REVIEW_ALLOWED_REPOS: "${REVIEW_ALLOWED_REPOS:-}"
      REVIEW_BRANCH_INCLUDE: "${REVIEW_BRANCH_INCLUDE:-}"
      REVIEW_BRANCH_EXCLUDE: "${REVIEW_BRANCH_EXCLUDE:-}"
      POLICY_V2_MODE: "${POLICY_V2_MODE:-legacy}"
      POLICY_V2_PATH: "${POLICY_V2_PATH:-.7review/review.yaml}"
      POLICY_RUNTIME_CAPABILITIES: "${POLICY_RUNTIME_CAPABILITIES:-repo.read,model.review}"
      CHANNEL_INBOUND_TOKEN: "${CHANNEL_INBOUND_TOKEN:-}"
      CHANNEL_AUTHORIZED_SENDERS: "${CHANNEL_AUTHORIZED_SENDERS:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_WHATSAPP_TEMPLATE_CONTENT_SID: "${TWILIO_WHATSAPP_TEMPLATE_CONTENT_SID:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      SIMPLEX_WS_URL: "${SIMPLEX_WS_URL:-}"
      GITHUB_API_URL: "${GITHUB_API_URL:-https://api.github.com}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      GITLAB_URL: "${GITLAB_URL:-}"
      GITLAB_TOKEN: "${GITLAB_TOKEN:-}"
      GITLAB_WEBHOOK_SECRET: "${GITLAB_WEBHOOK_SECRET:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      PROVIDER: "${PROVIDER:-}"
      PROVIDER_API_KEY: "${PROVIDER_API_KEY:-}"
      PROVIDER_BASE_URL: "${PROVIDER_BASE_URL:-}"
      REVIEW_MODEL: "${REVIEW_MODEL:-}"
      SMALL_MODEL: "${SMALL_MODEL:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - review-data:/data/7review
      - "${CORPUS_ROOT:-.}:/workspace:ro"
    depends_on:
      headroom:
        condition: service_healthy
      mempalace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/7review", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - review-agent

  headroom:
    build:
      context: ./docker/headroom-bridge
      dockerfile: Dockerfile
    image: 7review-headroom-bridge:local
    environment:
      HEADROOM_BRIDGE_PORT: "8787"
      HEADROOM_COMPRESSION_RATIO: "${HEADROOM_COMPRESSION_RATIO:-0.55}"
    expose:
      - "8787"
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - headroom-cache:/home/app/.cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - review-agent

  mempalace:
    build:
      context: ./docker/mempalace-bridge
      dockerfile: Dockerfile
    image: 7review-mempalace-bridge:local
    environment:
      MEMPALACE_BRIDGE_PORT: "8788"
      MEMPALACE_DATA_DIR: /data
      MEMPALACE_NAMESPACE: "${MEMPALACE_NAMESPACE:-7review}"
      MEMPALACE_CLI_TIMEOUT_SECONDS: "${MEMPALACE_CLI_TIMEOUT_SECONDS:-180}"
      MEMPALACE_EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - mempalace-data:/data
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8788"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - review-agent

networks:
  review-agent:
    driver: bridge

volumes:
  review-data:
  headroom-cache:
  mempalace-data:
